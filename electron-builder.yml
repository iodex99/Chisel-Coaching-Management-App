appId: com.chisel.coaching.management
productName: Chisel Coaching
copyright: Copyright © Chisel Coaching Classes

directories:
  output: release
  buildResources: build

# Bundle the compiled output + the runtime resources (logo, icons).
files:
  - out/**/*
  - resources/**/*
  - package.json

# The app has no native node modules. The SQLite WASM binary is read from the
# asar archive at runtime, so no asarUnpack is required for it.

extraMetadata:
  main: out/main/index.js

win:
  # A per-user NSIS installer (one .exe to deliver, no admin needed). It installs
  # into a writable per-user folder, so the app keeps its data in ./data next to
  # the executable — the folder stays copyable to a USB drive and the in-app
  # updater can swap program files in place. electron-builder also leaves the raw
  # win-unpacked folder behind, which CI zips for the updater to consume.
  target:
    - nsis

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Chisel Coaching
  artifactName: Chisel-Coaching-Setup-${version}.${ext}
  deleteAppDataOnUninstall: false

# The in-app updater handles updates; electron-builder does not publish.
publish: null
