name: Release

# Push a tag like v1.0.0 to build and publish a release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Baked into the app so the in-app updater can read this private repo.
          UPDATE_READ_TOKEN: ${{ secrets.UPDATE_READ_TOKEN }}

      - name: Package (portable unpacked folder)
        run: npx electron-builder --win --dir

      - name: Zip + manifest
        id: pkg
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $zip = "chisel-$version.zip"
          Compress-Archive -Path release/win-unpacked/* -DestinationPath $zip -Force
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          @{ version = $version; sha256 = $hash; assetName = $zip } | ConvertTo-Json | Set-Content -Path latest.json -Encoding utf8
          Write-Output "Built $zip ($hash)"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            chisel-*.zip
            latest.json
          fail_on_unmatched_files: true
