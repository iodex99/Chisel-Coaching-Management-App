name: Release

# Push a tag like v1.0.0 to build and publish a release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build renderer/main/preload
        run: npm run build
        env:
          # Baked into the app so the in-app updater can read this private repo.
          UPDATE_READ_TOKEN: ${{ secrets.UPDATE_READ_TOKEN }}

      - name: Build installer + publish (installer, latest.yml, blockmap)
        run: npx electron-builder --win --publish always
        env:
          # electron-builder uploads the release assets to GitHub with this token.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Ensure the release is published (electron-builder creates a draft)
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ github.ref_name }}" --draft=false --tag "${{ github.ref_name }}"
